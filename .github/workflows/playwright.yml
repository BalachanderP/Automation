name: Playwright Smoke Tests  # ✅ Name of the workflow shown in GitHub Actions

on:
  # ✅ Run automatically when code is pushed or PR created to main/master branches
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  # ✅ Allows manual run from the "Actions" tab in GitHub
  workflow_dispatch:

jobs:
  smoke-tests:
    timeout-minutes: 360
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: npm

    # 3️⃣ Install dependencies
    - name: Install dependencies
      run: npm ci

    # 4️⃣ Install Playwright browsers
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 5️⃣ Run smoke tests
    - name: Run Smoke Tests
      run: npx playwright test --grep "@smoke"
      env:
        BASE_URL: ${{ vars.BASE_URL || 'https://demo.automationtesting.in' }}
        USERNAME: ${{ secrets.TEST_USERNAME }}
        PASSWORD: ${{ secrets.TEST_PASSWORD }}

    # 6️⃣ Generate Allure report
    - name: Generate Allure Report
      if: always()
      continue-on-error: true
      run: |
        mkdir -p allure-report
        npx allure generate allure-results --clean -o allure-report || echo "No results found"

    # 7️⃣ Debug: List Allure report contents
    - name: List Allure folder  
      run:  ls -la allure-report

    # 8️⃣ Upload Allure report as artifact
    - name: Upload Allure Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report
        retention-days: 30

    # 9️⃣ Upload Playwright trace/video (if failed)
    - name: Upload Playwright Trace (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-trace
        path: playwright-report/