name: Playwright Smoke Tests  # ✅ Workflow name shown in GitHub Actions

on:
  # ✅ Automatically runs when code is pushed or PR is opened to main/master
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  # Runs daily at 11:30 PM India Standard Time (18:00 UTC).
  schedule:
    - cron: '0 18 * * *'

  # ✅ Allows manual run from the "Actions" tab
  workflow_dispatch:

jobs:
  smoke-tests:
    timeout-minutes: 360
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: read
    outputs:
      page_artifact_uploaded: ${{ steps.upload_pages.outcome == 'success' }}
    defaults:
      run:
        working-directory: QEUIAutomation

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: QEUIAutomation/package-lock.json

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Warn when GitHub Pages is unavailable
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.pages.outcome != 'success'
        run: echo "::warning::GitHub Pages is not configured or could not be reached. Enable Pages with GitHub Actions as its publishing source to deploy the report."

      - name: Restore Allure history
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.pages.outcome == 'success'
        continue-on-error: true
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p artifacts
          history_file="artifacts/allure-history.jsonl"
          if ! status=$(curl --silent --show-error --location --output "$history_file" --write-out '%{http_code}' "${PAGES_BASE_URL%/}/allure-history.jsonl"); then
            rm -f "$history_file"
            echo "::error::Failed to retrieve Allure history from GitHub Pages."
            exit 1
          fi
          case "$status" in
            200) echo "Restored Allure history." ;;
            404) rm -f "$history_file"; echo "No previous Allure history found." ;;
            *) rm -f "$history_file"; echo "::error::Failed to retrieve Allure history (HTTP $status)."; exit 1 ;;
          esac

      # 5️⃣ Run smoke tests
      - name: Run Smoke Tests
        id: smoke-tests
        run: npx playwright test --grep "@smoke"
        env:
          BASE_URL: ${{ vars.BASE_URL || secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          EXPECTED_ERROR: ${{ secrets.EXPECTED_ERROR }}

      # 6️⃣ Generate Allure report
      - name: Generate Allure Report
        if: always()
        continue-on-error: true
        run: npm run allure:generate

      # 7️⃣ Debug: List Allure report contents
      - name: List Allure folder
        if: always()
        run: ls -la artifacts/allure-report || true

      - name: Build scheduled execution dashboard
        if: always() && steps.pages.outcome == 'success' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && hashFiles('QEUIAutomation/artifacts/allure-report/index.html') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_EVENT: ${{ github.event_name }}
          GITHUB_RUN_REF: ${{ github.ref_name }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TEST_RESULT: ${{ steps.smoke-tests.outcome }}
        run: node scripts/generate-dashboard.mjs

      # 8️⃣ Upload the report as a workflow artifact
      - name: Upload Allure Playwright Report
        if: always() && hashFiles('QEUIAutomation/artifacts/allure-report/index.html') != ''
        uses: actions/upload-artifact@v4.4.0
        with:
          name: allure-report
          path: QEUIAutomation/artifacts/allure-report
          retention-days: 30

      # 9️⃣ Upload Playwright trace/video (if failed)
      - name: Upload Playwright Trace (if failed)
        if: failure()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: playwright-trace
          path: QEUIAutomation/artifacts/test-results/

      - name: Upload GitHub Pages site
        id: upload_pages
        if: always() && steps.pages.outcome == 'success' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && hashFiles('QEUIAutomation/artifacts/site/index.html') != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: QEUIAutomation/artifacts/site

  deploy-pages:
    needs: smoke-tests
    if: always() && needs.smoke-tests.outputs.page_artifact_uploaded == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report and dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
